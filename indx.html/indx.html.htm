<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج احترافي - بالمستويات ونافذة النتيجة</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #161512;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* ------------------ شاشة البداية ------------------ */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background-color: #262421;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #363431;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        #start-screen h1 {
            color: #f0d9b5;
            font-size: 2.2rem;
        }

        #start-screen p {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .mode-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-pvp {
            background: linear-gradient(135deg, #b58863, #8a5a36);
            color: white;
        }

        .level-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #1e1d1b;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #363431;
        }

        .level-title {
            font-size: 0.9rem;
            color: #81b64c;
            font-weight: bold;
        }

        .btn-level {
            background-color: #363431;
            color: #ddd;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            cursor: pointer;
            text-align: right;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .btn-level:hover {
            background-color: #81b64c;
            color: #fff;
            border-color: #81b64c;
        }

        .btn-level span {
            font-size: 0.75rem;
            opacity: 0.8;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* ------------------ شاشة اللعبة ------------------ */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 15px;
        }

        .player-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 70vh;
            max-width: 85vw;
            background-color: #262421;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #363431;
            transition: border-color 0.3s;
        }

        .player-bar.active-turn {
            border-color: #81b64c;
            box-shadow: 0 0 10px rgba(129, 182, 76, 0.2);
        }

        .guest-avatar {
            width: 42px;
            height: 42px;
            background-color: #363431;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            border: 2px solid #555;
        }

        .guest-avatar svg {
            width: 24px;
            height: 24px;
            fill: #aaa;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 110px;
        }

        .player-name {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }

        .player-color {
            font-size: 0.75rem;
            color: #888;
        }

        .captured-tray {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 2px;
            margin-right: auto;
            min-height: 26px;
        }

        .captured-tray svg {
            width: 22px;
            height: 22px;
        }

        #chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 70vh;
            height: 70vh;
            max-width: 85vw;
            max-height: 85vw;
            border: 4px solid #2c2b29;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            border-radius: 6px;
            position: relative;
            touch-action: none;
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .white-square { background-color: #f0d9b5; }
        .black-square { background-color: #b58863; }

        .piece {
            width: 85%;
            height: 85%;
            cursor: grab;
            z-index: 2;
            touch-action: none;
        }

        .dragging-clone {
            position: fixed !important;
            pointer-events: none;
            z-index: 9999 !important;
            width: 75px;
            height: 75px;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.6));
        }

        .square.selected { background-color: #bbcce6 !important; }
        .square.check-red { background-color: #e63946 !important; }

        .hint::after {
            content: '';
            position: absolute;
            width: 25%;
            height: 25%;
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            z-index: 1;
        }

        .controls-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            width: 70vh;
            max-width: 85vw;
            margin-top: 5px;
        }

        .status-text {
            font-size: 0.9rem;
            color: #bababa;
        }

        .btn-small {
            background-color: #262421;
            color: #ccc;
            border: 1px solid #363431;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-small:hover {
            background-color: #363431;
            color: #fff;
        }

        /* ------------------ نافذة النتيجة (Modal) ------------------ */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-card {
            background-color: #262421;
            border: 2px solid #81b64c;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-icon {
            font-size: 3rem;
        }

        .modal-title {
            font-size: 1.6rem;
            color: #fff;
            font-weight: bold;
        }

        .modal-subtitle {
            font-size: 1rem;
            color: #aaa;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-modal {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-restart {
            background-color: #81b64c;
            color: white;
        }

        .btn-home {
            background-color: #363431;
            color: #ccc;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. شاشة اختيار النمط والمستويات -->
    <div id="start-screen">
        <h1>شطرنج</h1>
        <p>اختر وضع اللعب أو مستوى الكمبيوتر:</p>

        <div class="level-container">
            <div class="level-title">🤖 اللعب ضد الكمبيوتر (المستويات)</div>
            <button class="btn-level" onclick="startGame('ai', 1)">
                🟢 مبتدئ
                <span>Elo 800</span>
            </button>
            <button class="btn-level" onclick="startGame('ai', 2)">
                🟡 لاعب أندية (متوسط)
                <span>Elo 1500</span>
            </button>
            <button class="btn-level" onclick="startGame('ai', 3)">
                🟠 أستاذ دولي (IM)
                <span>Elo 2400</span>
            </button>
            <button class="btn-level" onclick="startGame('ai', 4)">
                🔴 أستاذ كبير (GM)
                <span>Elo 2700</span>
            </button>
        </div>

        <button class="mode-btn btn-pvp" onclick="startGame('pvp')">👥 لعب ضد صديق</button>
    </div>

    <!-- 2. شاشة اللعبة الرئيسيّة -->
    <div id="game-screen">

        <!-- Player 2 (الأسود / الكمبيوتر) -->
        <div class="player-bar" id="player2-bar">
            <div class="guest-avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="player-info">
                <span class="player-name" id="p2-name">Player 2</span>
                <span class="player-color" id="p2-level-desc">الأسود</span>
            </div>
            <div class="captured-tray" id="p2-captured"></div>
        </div>

        <!-- رقعة الشطرنج -->
        <div id="chessboard"></div>

        <!-- Player 1 (الأبيض / أنت) -->
        <div class="player-bar" id="player1-bar">
            <div class="guest-avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="player-info">
                <span class="player-name">Player 1</span>
                <span class="player-color">الأبيض</span>
            </div>
            <div class="captured-tray" id="p1-captured"></div>
        </div>

        <!-- خيارات سريعة -->
        <div class="controls-bar">
            <span class="status-text" id="status-message">دور الأبيض</span>
            <div>
                <button class="btn-small" onclick="resetGame()">إعادة</button>
                <button class="btn-small" onclick="exitToMenu()">القائمة</button>
            </div>
        </div>

    </div>

    <!-- 3. نافذة إعلان الفائز (Game Over Modal) -->
    <div id="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon" id="modal-icon">🏆</div>
            <div class="modal-title" id="modal-winner">فاز Player 1!</div>
            <div class="modal-subtitle" id="modal-reason">عن طريق كش مات</div>
            <div class="modal-actions">
                <button class="btn-modal btn-restart" onclick="closeModalAndRestart()">لعب مرة أخرى</button>
                <button class="btn-modal btn-home" onclick="closeModalAndExit()">القائمة الرئيسية</button>
            </div>
        </div>
    </div>

            'q': `<svg viewBox="0 0 45 45" class="piece"><g fill="none" fill-rule="evenodd" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M 9,26 C 17.5,24.5 30,24.5 36,26 L 38.5,13.5 L 31,25 L 22.5,10 L 14,25 L 6.5,13.5 L 9,26 z" fill="#363636" stroke="#fff"/><path d="M 9,26 C 9,28 10.5,28 11.5,30 C 12.5,32 12.5,35 12.5,35 L 32.5,35 C 32.5,35 32.5,32 33.5,30 C 34.5,28 36,28 36,26 L 9,26 z" fill="#363636" stroke="#fff"/><path d="M 11.5,30 C 15,29 30,29 33.5,30" stroke="#fff"/><path d="M 12,35.5 L 33,35.5 L 33,39.5 L 12,39.5 L 12,35.5 z" fill="#363636" stroke="#fff"/><circle cx="6" cy="12" r="2" fill="#363636" stroke="#fff"/><circle cx="14" cy="9" r="2" fill="#363636" stroke="#fff"/><circle cx="22.5" cy="7.5" r="2" fill="#363636" stroke="#fff"/><circle cx="31" cy="9" r="2" fill="#363636" stroke="#fff"/><circle cx="39" cy="12" r="2" fill="#363636" stroke="#fff"/></g></svg>`,
            'k': `<svg viewBox="0 0 45 45" class="piece"><g fill="none" fill-rule="evenodd" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M 22.5,11.63 L 22.5,6" stroke="#fff"/><path d="M 22.5,25 C 22.5,25 27,17.5 27,14 C 27,11.5 25,9.5 22.5,9.5 C 20,9.5 18,11.5 18,14 C 18,17.5 22.5,25 22.5,25 z" fill="#363636" stroke="#fff"/><path d="M 11.5,37 C 17,35.5 28,35.5 33.5,37 L 33.5,30 C 33.5,30 31,25 22.5,25 C 14,25 11.5,30 11.5,30 L 11.5,37 z" fill="#363636" stroke="#fff"/><path d="M 11.5,37 L 33.5,37 L 33.5,40 L 11.5,40 L 11.5,37 z" fill="#363636" stroke="#fff"/><path d="M 20,8 L 25,8" stroke="#fff"/></g></svg>`
        };

        function startGame(mode, level = 1) {
            gameMode = mode;
            aiLevel = level;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            if (mode === 'ai') {
                document.getElementById('p2-name').innerText = 'الكمبيوتر (AI)';
                document.getElementById('p2-level-desc').innerText = levelNames[level];
            } else {
                document.getElementById('p2-name').innerText = 'Player 2';
                document.getElementById('p2-level-desc').innerText = 'الأسود';
            }
            resetGame();
        }

        function exitToMenu() {
            closeModal();
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        }

        function resetGame() {
            closeModal();
            game.reset();
            selectedSquare = null;
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            const board = game.board();

            let inCheckSquare = null;
            if (game.in_check()) {
                const turn = game.turn();
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = board[r][c];
                        if (p && p.type === 'k' && p.color === turn) {
                            inCheckSquare = String.fromCharCode(97 + c) + (8 - r);
                        }
                    }
                }
            }

            let validMoves = [];
            if (selectedSquare) {
                validMoves = game.moves({ square: selectedSquare, verbose: true }).map(m => m.to);
            }

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareName = String.fromCharCode(97 + c) + (8 - r);
                    const squareDiv = document.createElement('div');
                    
                    const isWhiteSquare = (r + c) % 2 === 0;
                    squareDiv.className = `square ${isWhiteSquare ? 'white-square' : 'black-square'}`;
                    squareDiv.dataset.square = squareName;

                    if (squareName === selectedSquare) squareDiv.classList.add('selected');
                    if (squareName === inCheckSquare) squareDiv.classList.add('check-red');
                    if (validMoves.includes(squareName)) squareDiv.classList.add('hint');

                    const piece = board[r][c];
                    if (piece) {
                        const symbolKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        squareDiv.innerHTML = svgPieces[symbolKey];
                        const pieceEl = squareDiv.querySelector('.piece');

                        pieceEl.addEventListener('pointerdown', (e) => onPiecePointerDown(e, squareName));
                    }

                    squareDiv.addEventListener('pointerup', () => onSquareClick(squareName));
                    boardElement.appendChild(squareDiv);
                }
            }

            updateUIStatus();
        }

        function onPiecePointerDown(e, square) {
            if (game.game_over()) return;
            if (gameMode === 'ai' && game.turn() !== 'w') return;

            const piece = game.get(square);
            if (!piece || piece.color !== game.turn()) return;

            e.preventDefault();
            e.stopPropagation();

            dragSourceSquare = square;
            selectedSquare = square;

            const originalPiece = e.currentTarget;
            draggedPieceEl = originalPiece.cloneNode(true);
            draggedPieceEl.classList.add('dragging-clone');
            document.body.appendChild(draggedPieceEl);

            updateDraggedPosition(e);
            originalPiece.style.opacity = '0.3';

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);

            renderBoard();
        }

        function updateDraggedPosition(e) {
            if (!draggedPieceEl) return;
            draggedPieceEl.style.left = `${e.clientX}px`;
            draggedPieceEl.style.top = `${e.clientY}px`;
        }

        function onPointerMove(e) {
            if (draggedPieceEl) updateDraggedPosition(e);
        }

        function onPointerUp(e) {
            if (!draggedPieceEl) return;

            draggedPieceEl.remove();
            draggedPieceEl = null;

            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);

            const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
            const targetSquare = dropTarget ? dropTarget.closest('.square') : null;

            if (targetSquare && dragSourceSquare) {
                const toSquare = targetSquare.dataset.square;
                if (dragSourceSquare !== toSquare) {
                    makeMove(dragSourceSquare, toSquare);
                }
            }

            dragSourceSquare = null;
            renderBoard();
        }

        function onSquareClick(squareName) {
            if (selectedSquare && selectedSquare !== squareName) {
                makeMove(selectedSquare, squareName);
            }
        }

        function makeMove(from, to) {
            const move = game.move({
                from: from,
                to: to,
                promotion: 'q'
            });

            selectedSquare = null;
            renderBoard();

            if (move && !game.game_over()) {
                if (gameMode === 'ai' && game.turn() === 'b') {
                    setTimeout(makeBotMove, 300);
                }
            }
        }

        /* ------------------ محرك الذكاء الاصطناعي (حسب المستوى) ------------------ */
        const pawnPST = [
            0,  0,  0,  0,  0,  0,  0,  0,
            50, 50, 50, 50, 50, 50, 50, 50,
            10, 10, 20, 30, 30, 20, 10, 10,
             5,  5, 10, 25, 25, 10,  5,  5,
             0,  0,  0, 20, 20,  0,  0,  0,
             5, -5,-10,  0,  0,-10, -5,  5,
             5, 10, 10,-20,-20, 10, 10,  5,
             0,  0,  0,  0,  0,  0,  0,  0
        ];

        function evaluateBoard(board) {
            const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
            let total = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p) {
                        let val = pieceValues[p.type];
                        if (p.type === 'p') val += pawnPST[r * 8 + c];
                        total += p.color === 'b' ? val : -val;
                    }
                }
            }
            return total;
        }

        // Minimax مع Alpha-Beta Pruning للمستويات الاحترافية
        function minimax(depth, alpha, beta, isMaximizing) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(game.board());
            }

            const moves = game.moves();
            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let evaluation = minimax(depth - 1, alpha, beta, false);
                    game.undo();
                    maxEval = Math.max(maxEval, evaluation);
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let evaluation = minimax(depth - 1, alpha, beta, true);
                    game.undo();
                    minEval = Math.min(minEval, evaluation);
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function makeBotMove() {
            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            let selectedMove = null;

            // Level 1: مبتدئ (عشوائي)
            if (aiLevel === 1) {
                selectedMove = moves[Math.floor(Math.random() * moves.length)];
            } 
            // Level 2: متوسط (نظرة لخطوة واحدة)
            else if (aiLevel === 2) {
                let bestVal = -Infinity;
                for (let move of moves) {
                    game.move(move);
                    let val = evaluateBoard(game.board());
                    game.undo();
                    if (val > bestVal) {
                        bestVal = val;
                        selectedMove = move;
                    }
                }
            }
            // Level 3: أستاذ دولي IM (عمق 2)
            else if (aiLevel === 3) {
                let bestVal = -Infinity;
                for (let move of moves) {
                    game.move(move);
                    let val = minimax(2, -Infinity, Infinity, false);
                    game.undo();
                    if (val > bestVal) {
                        bestVal = val;
                        selectedMove = move;
                    }
                }
            }
            // Level 4: أستاذ كبير GM (عمق 3)
            else if (aiLevel === 4) {
                let bestVal = -Infinity;
                for (let move of moves) {
                    game.move(move);
                    let val = minimax(3, -Infinity, Infinity, false);
                    game.undo();
                    if (val > bestVal) {
                        bestVal = val;
                        selectedMove = move;
                    }
                }
            }

            if (!selectedMove) selectedMove = moves[Math.floor(Math.random() * moves.length)];
            
            game.move(selectedMove);
            renderBoard();
        }

        /* ------------------ تحديث النتيجة وإظهار نافذة الفائز ------------------ */
        function updateUIStatus() {
            const statusMsg = document.getElementById('status-message');
            const p1Bar = document.getElementById('player1-bar');
            const p2Bar = document.getElementById('player2-bar');

            if (game.turn() === 'w') {
                p1Bar.classList.add('active-turn');
                p2Bar.classList.remove('active-turn');
            } else {
                p2Bar.classList.add('active-turn');
                p1Bar.classList.remove('active-turn');
            }

            if (game.game_over()) {
                showGameOverModal();
            } else if (game.in_check()) {
                statusMsg.innerText = (game.turn() === 'w' ? 'دور الأبيض' : 'دور الأسود') + ' (كش!)';
            } else {
                statusMsg.innerText = game.turn() === 'w' ? 'دور الأبيض' : 'دور الأسود';
            }

            // تحديث القطع المأكولة
            const history = game.history({ verbose: true });
            const p1Captured = document.getElementById('p1-captured');
            const p2Captured = document.getElementById('p2-captured');
            p1Captured.innerHTML = '';
            p2Captured.innerHTML = '';

            history.forEach(move => {
                if (move.captured) {
                    if (move.color === 'w') {
                        const pieceKey = move.captured.toLowerCase();
                        p1Captured.innerHTML += svgPieces[pieceKey];
                    } else {
                        const pieceKey = move.captured.toUpperCase();
                        p2Captured.innerHTML += svgPieces[pieceKey];
                    }
                }
            });
        }

        function showGameOverModal() {
            const modal = document.getElementById('modal-overlay');
            const winnerText = document.getElementById('modal-winner');
            const reasonText = document.getElementById('modal-reason');
            const iconText = document.getElementById('modal-icon');

            modal.style.display = 'flex';

            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? (gameMode === 'ai' ? 'الكمبيوتر' : 'Player 2 (الأسود)') : 'Player 1 (الأبيض)';
                winnerText.innerText = `فاز ${winner}!`;
                reasonText.innerText = 'عن طريق كش مات 🎯';
                iconText.innerText = '🏆';
            } else if (game.in_draw()) {
                winnerText.innerText = 'تعادل!';
                iconText.innerText = '🤝';
                if (game.in_stalemate()) {
                    reasonText.innerText = 'بسبب عدم وجود نقلات متاحة (Stalemate)';
                } else if (game.in_threefold_repetition()) {
                    reasonText.innerText = 'بسبب تكرار النقلات 3 مرات';
                } else {
                    reasonText.innerText = 'بسبب عدم كفاية القطع للمات';
                }
            }
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function closeModalAndRestart() {
            closeModal();
            resetGame();
        }

        function closeModalAndExit() {
            closeModal();
            exitToMenu();
        }
    </script>
